# 语言和显示设置


# 设置语言（可用选项见：https://github.com/Samillion/ModernZ/blob/main/docs/TRANSLATIONS.md）
language=zh
# 设置图标主题，可选 fluent 或 material
icon_theme=fluent
# OSC 使用的字体（默认：mpv-osd-symbols 或 mpv.conf 中设置的字体）
font=mpv-osd-symbols


# 屏幕空闲状态显示


# 空闲时显示 mpv Logo
idlescreen=yes
# 显示 OSC 顶部栏，可选 "auto"、"yes" 或 "no"（无边框/全屏模式）
window_top_bar=auto
# 窗口模式下显示 OSC
showwindowed=yes
# 全屏模式下显示 OSC
showfullscreen=yes
# 暂停时显示 OSC
showonpause=no
# 暂停时禁用 OSC 自动隐藏
keeponpause=no
# 关闭 12 月圣诞帽显示
greenandgrumpy=no


# OSC 行为与缩放


# 无鼠标操作时 OSC 自动隐藏时间（毫秒）
hidetimeout=500
# 跳转视频时是否重置 hidetimeout
seek_resets_hidetimeout=yes
# 淡出效果时间（毫秒），设为 0 则无淡出
fadeduration=200
# 是否启用淡入效果
fadein=no
# 显示 OSC 需要的最小鼠标移动（像素）
minmousemove=0
# 仅在鼠标悬停底部时显示 OSC
bottomhover=yes
# bottomhover 区域高度（像素）
bottomhover_zone=130
# 拖动进度条时显示 OSC
osc_on_seek=no
# 每次播放文件开始时显示 OSC
osc_on_start=no
# 拖动进度条时暂停视频（按住按钮）
mouse_seek_pause=yes
# 即使鼠标未悬停在进度条上，也显示进度提示
force_seek_tooltip=no

# 是否随视频缩放 OSC
vidscale=auto
# 窗口模式下 OSC 缩放比例
scalewindowed=1.0
# 全屏模式下 OSC 缩放比例
scalefullscreen=1.0


# 元素显示


# 在进度条上方显示标题
show_title=no
# 标题格式，可用 "${media-title}" 或 "${filename}"
title=${media-title}
# 标题字体大小
title_font_size=24
# 章节标题字体大小
chapter_title_font_size=14
# 显示缓存时间信息
cache_info=no
# 显示缓存速度（每秒）
cache_info_speed=no
# 缓存信息字体大小
cache_info_font_size=12

# 在时间戳旁显示章节标题（进度条下方）
show_chapter_title=yes
# 进度条悬停显示章节格式，设为 "no" 禁用
chapter_fmt=%s

# 显示总时长而非剩余时间
timetotal=yes
# 显示毫秒
timems=no
# 剩余时间使用 Unicode 减号
unicodeminus=no
# 时间显示模式："dynamic"（可能显示 MM:SS）或 "fixed"（总显示 HH:MM:SS）
time_format=dynamic
# 时间字体大小
time_font_size=16
# 提示字体大小
tooltip_font_size=14


# 标题栏设置


# 无边框/全屏时显示窗口标题
window_title=yes
# 无边框/全屏时显示窗口控制按钮（关闭、最小化、最大化）
window_controls=yes
# 顶部栏标题格式
windowcontrols_title=${media-title}


# 字幕显示


# 字幕显示时抬高到 OSC 上方
raise_subtitles=yes
# 字幕抬高的像素量
raise_subtitle_amount=125


# 按钮显示与功能


# 显示跳转前后按钮
jump_buttons=yes
# 跳转时间（秒）
jump_amount=5
# 右键或 Shift + 点击章节跳转按钮时的跳转时间
jump_more_amount=60
# 当 jump_amount 为 5/10/30 秒时显示不同图标
jump_icon_number=yes
# 跳转模式
jump_mode=relative
# 按住跳转按钮时连续跳转
jump_softrepeat=yes
# 显示章节跳转按钮
chapter_skip_buttons=no
# 按住章节跳转按钮时连续跳转
chapter_softrepeat=yes
# 显示上一/下一播放列表曲目按钮
track_nextprev_buttons=yes

# 显示静音按钮和音量滑块
volume_control=yes
# 音量刻度类型："linear" 或 "logarithmic"
volume_control_type=linear
# 显示播放列表按钮：左键普通列表，右键交互列表
playlist_button=yes
# 无播放列表时隐藏播放列表按钮
hide_empty_playlist_button=no
# 无播放列表时灰显播放列表按钮
gray_empty_playlist_button=no

# 网页视频显示下载按钮（需 yt-dlp 和 ffmpeg）
download_button=yes
# 默认下载目录
download_path=~~desktop/mpv
# 显示截图按钮
screenshot_button=no
# 截图类型："subtitles"、"video"、"window"、"each-frame"
screenshot_flag=subtitles

# 显示窗口置顶按钮
ontop_button=yes
# 显示循环按钮
loop_button=yes
# 显示速度控制按钮
speed_button=no
# 点击改变的速度
speed_button_click=1
# 滚轮改变的速度
speed_button_scroll=0.25
# 显示信息按钮
info_button=yes
# 显示全屏切换按钮
fullscreen_button=yes

# 暂停时右键启用循环
loop_in_pause=no

# 强制按钮始终可用，可加: playlist_prev,playlist_next
buttons_always_active=none

# 播放/暂停按钮图标大小
playpause_size=28
# 中间按钮图标大小
midbuttons_size=24
# 侧边按钮图标大小
sidebuttons_size=24

# 图片模式显示缩放控制
zoom_control=yes
# 最大缩放倍数
zoom_in_max=4
# 最小缩放倍数
zoom_out_min=-1


# 颜色与样式


# OSC 和标题栏主色
osc_color=#000000
# 无边框/全屏标题颜色
window_title_color=#FFFFFF
# 窗口控制按钮颜色
window_controls_color=#FFFFFF
# 鼠标悬停关闭按钮颜色
windowcontrols_close_hover=#F45C5B
# 鼠标悬停最大化按钮颜色
windowcontrols_max_hover=#F8BC3A
# 鼠标悬停最小化按钮颜色
windowcontrols_min_hover=#43CB44
# 进度条上方标题颜色
title_color=#FFFFFF
# 缓存信息颜色
cache_info_color=#FFFFFF
# 进度条前景色和滑块颜色
seekbarfg_color=#FFFFFF
# 进度条背景色
seekbarbg_color=#FFFFFF
# 缓存范围颜色
seekbar_cache_color=#FFFFFF
# 音量条是否与进度条颜色匹配
volumebar_match_seek_color=no
# 时间戳颜色
time_color=#FFFFFF
# 章节标题颜色
chapter_title_color=#FFFFFF
# 侧边按钮颜色（音频、字幕、播放列表等）
side_buttons_color=#FFFFFF
# 中间按钮颜色（跳转、章节等）
middle_buttons_color=#FFFFFF
# 播放/暂停按钮颜色
playpause_color=#FFFFFF
# 按下时元素颜色
held_element_color=#999999
# 悬停按钮颜色（hover_effect 包含 "color" 时生效）
hover_effect_color=#FFFFFF
# 缩略图边框颜色（thumbfast）
thumbnail_border_color=#FFFFFF
# 缩略图边框轮廓颜色
thumbnail_border_outline=#999999

# OSC 背景盒透明度
fade_alpha=130
# OSC 背景模糊强度，高值占用 CPU
fade_blur_strength=100
# 与 fade_blur_strength=0 配合使用以创建透明盒
fade_transparency_strength=0
# 窗口标题栏透明度
window_fade_alpha=100
# 窗口标题栏模糊强度
window_fade_blur_strength=100
# 与 window_fade_blur_strength=0 配合使用以创建透明盒
window_fade_transparency_strength=0
# 缩略图边框宽度（thumbfast）
thumbnail_border=3
# 缩略图圆角半径
thumbnail_border_radius=3


# 按钮悬停效果


# 悬停效果：可用 "glow"、"size"、"color"，可组合
hover_effect=size,glow,color
# 悬停时按钮相对大小
hover_button_size=115
# glow 光晕强度
button_glow_amount=5
# 滑块也应用悬停大小效果
hover_effect_for_sliders=yes


# 提示与提示文本


# 为禁用按钮启用提示
tooltips_for_disabled_elements=yes
# 为 info、loop、ontop、screenshot 按钮显示文本提示
tooltip_hints=yes


# 进度条设置


# 进度条滑块大小比例（0~1）
seek_handle_size=0.7
# 显示 seek 范围覆盖
seekrange=yes
# seek 范围透明度
seekrangealpha=150
# 视频时长变化时更新章节标记
livemarkers=yes
# 拖动进度条使用关键帧
seekbarkeyframes=no
# 进度条上方章节标记
nibbles_top=yes
# 进度条下方章节标记
nibbles_bottom=yes
# 章节标记样式："triangle"、"bar" 或 "single-bar"
nibbles_style=triangle

# 根据视频长度自动设置关键帧
automatickeyframemode=yes
# 超过此长度的视频（秒）自动生成关键帧
automatickeyframelimit=600

# 始终在屏幕底部显示小进度条
persistentprogress=no
# 小进度条高度
persistentprogressheight=17
# 网页视频显示缓冲状态
persistentbuffer=no


# 杂项设置


# 初始化时使用的可见性模式
visibility=auto
# 可循环的可见性模式，用下划线分隔：never_auto_always
visibility_modes=never_auto_always
# OSC 最小重绘间隔（秒）
tick_delay=0.03
# 是否使用显示器帧率作为最小重绘间隔
tick_delay_follow_display_fps=no


# 元素位置


# 方便调整字体大小或类型时设置元素高度

# 标题（上方进度条）高度
title_height=96
# 含章节标题时标题高度
title_with_chapter_height=108
# 章节标题高度
chapter_title_height=91
# 时间戳高度
time_codes_height=35
# 竖屏窗口时间戳高度
time_codes_centered_height=57
# 提示文本高度偏移
tooltip_height_offset=2
# 提示文本过长时左移偏移量
tooltip_left_offset=5
# 竖屏窗口宽度触发器
portrait_window_trigger=1000
# 隐藏音量条的窗口宽度阈值
hide_volume_bar_trigger=1150
# 禁用标题时 OSC 高度偏移
notitle_osc_h_offset=25
# 禁用章节标题时 OSC 高度偏移
nochapter_osc_h_offset=10
# 进度悬停提示高度偏移
seek_hover_tooltip_h_offset=0
# OSC 高度（不含偏移）
osc_height=132


# 鼠标操作


# 详情: https://github.com/Samillion/ModernZ#mouse-commands-user-options

# 标题上鼠标操作
title_mbtn_left_command=script-binding stats/display-page-5
title_mbtn_mid_command=show-text ${path}
title_mbtn_right_command=script-binding select/select-watch-history; script-message-to modernz osc-hide

# 播放列表按钮鼠标操作
playlist_mbtn_left_command=script-binding select/select-playlist; script-message-to modernz osc-hide
playlist_mbtn_right_command=script-binding select/menu; script-message-to modernz osc-hide

# 音量控制鼠标操作
vol_ctrl_mbtn_left_command=no-osd cycle mute
vol_ctrl_mbtn_right_command=script-binding select/select-audio-device; script-message-to modernz osc-hide
vol_ctrl_wheel_down_command=no-osd add volume -5
vol_ctrl_wheel_up_command=no-osd add volume 5

# 音轨按钮鼠标操作
audio_track_mbtn_left_command=script-binding select/select-aid; script-message-to modernz osc-hide
audio_track_mbtn_mid_command=cycle audio down
audio_track_mbtn_right_command=cycle audio
audio_track_wheel_down_command=cycle audio
audio_track_wheel_up_command=cycle audio down

# 字幕按钮鼠标操作
sub_track_mbtn_left_command=script-binding select/select-sid; script-message-to modernz osc-hide
sub_track_mbtn_mid_command=cycle sub down
sub_track_mbtn_right_command=cycle sub
sub_track_wheel_down_command=cycle sub
sub_track_wheel_up_command=cycle sub down

# 章节跳转按钮鼠标操作
chapter_prev_mbtn_left_command=add chapter -1
chapter_prev_mbtn_mid_command=show-text ${chapter-list} 3000
chapter_prev_mbtn_right_command=script-binding select/select-chapter; script-message-to modernz osc-hide

chapter_next_mbtn_left_command=add chapter 1
chapter_next_mbtn_mid_command=show-text ${chapter-list} 3000
chapter_next_mbtn_right_command=script-binding select/select-chapter; script-message-to modernz osc-hide

# 章节标题按钮鼠标操作
chapter_title_mbtn_left_command=script-binding select/select-chapter; script-message-to modernz osc-hide
chapter_title_mbtn_right_command=show-text ${chapter-list} 3000

# 播放列表切换按钮鼠标操作
playlist_prev_mbtn_left_command=playlist-prev
playlist_prev_mbtn_mid_command=show-text ${playlist} 3000
playlist_prev_mbtn_right_command=script-binding select/select-playlist; script-message-to modernz osc-hide

playlist_next_mbtn_left_command=playlist-next
playlist_next_mbtn_mid_command=show-text ${playlist} 3000
playlist_next_mbtn_right_command=script-binding select/select-playlist; script-message-to modernz osc-hide

# 全屏按钮鼠标操作
fullscreen_mbtn_left_command=cycle fullscreen
fullscreen_mbtn_right_command=cycle window-maximized

# 信息按钮鼠标操作
info_mbtn_left_command=script-binding stats/display-page-1-toggle