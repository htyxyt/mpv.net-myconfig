################
# 滤镜&着色器配置 #
################
# vf = 'fps=fps=60/1.001'           # 强制视频输出帧率为 59.94 帧（常用于匹配旧式电视显示）。
# vf = 'fps=fps=${display-fps}'     # 强制视频帧率同步为显示器刷新率（容易导致音画同步压力）。
# vf = 'vapoursynth=~~/vs/MEMC_MVT_LQ.vpy' # VapourSynth 非线性补帧：mvtools 模式（低功耗，画质一般）。
# vf = 'vapoursynth=~~/vs/MEMC_SVP_LQ.vpy' # VapourSynth 非线性补帧：svpflow 模式（画质较好，开销较大）。
# glsl-shaders = '~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl' # 加载 Anime4K 实时放大与修复着色器。

################
#    其他配置    #
################
profile = SRT-Drama                  # 启动时默认加载 [SRT-Drama] 段落定义的预设配置。

################
#    播放配置    #
################
vo = gpu                             # 使用视频显卡渲染（最通用的高性能渲染模式）。
ao = wasapi                          # 使用 Windows 原生音频流输出（减少系统混音干扰）。
hwdec = auto-safe                    # 硬件解码模式：优先使用对画质无损的硬解（如 D3D11VA）。
gpu-context = d3d11                  # 显卡渲染后端：Windows 环境下 D3D11 性能与稳定性最佳。
audio-file-auto = fuzzy              # 自动加载音频文件：fuzzy 表示名称部分匹配即可加载。
sub-auto = fuzzy                     # 自动加载字幕文件：fuzzy 表示名称部分匹配即可加载。
loop-playlist = inf                  # 播放列表循环模式：inf 表示无限循环。
demuxer-max-bytes = 512MiB           # 设置解复用器的最大缓存大小，防止网络流或大文件播放卡顿。
video-sync = audio        			 # 核心同步模式：将视频帧计时到音频。这是最稳健的模式。
hr-seek-framedrop = no               # 精确跳转时不丢弃视频帧，确保跳转后画面立即恢复流畅。
interpolation = yes                  # 启用帧插值（Motion Smoothing），消除运动抖动。
tscale = oversample                  # 用于插值时间轴（帧）的filter。 oversample 是最清晰/最不平滑的。
secondary-sub-ass-override = yes     # 允许播放器样式覆盖次要字幕（如第二语言字幕）的 ASS 指令。
pause = no                           # 启动 mpv 后直接开始播放，不进入暂停状态。


################
# 画质优化（去彩虹纹和锐化） #
################
deband = yes                         # 开启去色带滤镜：核心功能是消除视频因压缩产生的色阶断层（彩虹纹）。
deband-iterations = 1                # 去色带迭代次数：1次通常足够，数值越高色彩越平滑但细节损失越大。
deband-threshold = 32                # 去色带阈值：敏感度设置，增加此值可消除更明显的断层伪影。
dither-depth = auto                  # 设置抖动深度：auto 会根据显示器位深自动选择（如 8bit 或 10bit）。
dither = fruit                       # 抖动算法：fruit 是 mpv 默认的高质量算法，用于平滑模拟高位深色彩。
sigmoid-upscaling = yes              # S形缩放转换：在放大画面时保护亮部和暗部边缘，减少光晕（Ringing）。
linear-downscaling = yes             # 线性光缩小：在缩小画面时转换到线性光空间处理，确保颜色亮度准确。
correct-downscaling = yes            # 修正缩小时的走样：通过更科学的采样方式，减少缩小视频时的锯齿感。
#scale = ewa_lanczossharp			 # 在清晰度和开销之间平衡最好的锐化算法。
sharpen = 0.5                        # 弥补 deband 带来的模糊感。
dscale = mitchell 				 	 # 视频缩小算法，在缩小画面时，防止线条出现“锯齿”或“闪烁”。
cscale = mitchell 				 	 # 色度缩放算法，减少色彩交界处的“光晕”和“伪影”。

################
# 屏显式控制器配置 #
################
osc = no                             # 彻底关闭 mpv 内置的黑底进度条界面，转而支持加载 Lua 脚本界面。
osd-font-size = 40                   # 设置屏幕上方信息（OSD）的文字大小。
osd-border-size = 1                  # 设置 OSD 文字的描边宽度。
osd-bar-w = 100                      # 设置 OSD 进度条的宽度占屏幕的百分比。
osd-bar-h = 2                        # 设置 OSD 进度条的高度。
osd-bar-align-y = -1                 # OSD 进度条垂直位置：-1 表示紧贴屏幕底部。
osd-bar-border-size = 0.4            # OSD 进度条的外边框线条粗细。
osd-playing-msg =                    # 播放开始时要在屏幕显示的文字消息（留空表示不显示）。
osd-duration = 1000                  # 所有 OSD 提示信息的停留时长（1000 毫秒 = 1 秒）。

################
#  窗口显示配置  #
################
border = yes                         # 显示操作系统原生的窗口边框（包含最小化、关闭按钮）。
snap-window = yes                    # 开启窗口边缘吸附（贴近屏幕边界时自动吸附）。
autofit =                            # 初始窗口大小设置（留空则由系统默认）。
autofit-smaller = 20                 # 当视频太小时，自动放大至占据屏幕宽度的 20%。
autofit-larger = 80                  # 当视频太大时，自动缩小至占据屏幕宽度的 80%。
hidpi-window-scale = no              # 是否让窗口跟随 Windows 的缩放设置（mpv.net 环境下通常无效）。
window-scale = 1                     # 初始窗口缩放倍率（1 表示 100% 原始大小）。

################
#   条件配置预设   #
################

[speed-limit]
profile-desc = 速度变化下限的控制
profile-cond = p.speed<0.1           # 当播放速度被调至 0.1 以下时触发。
speed = 0.1                          # 强制修正播放速度为 0.1，防止完全静止。

[ontop-playback]
profile-desc = 基于播放状态的自动置顶
#profile-cond = not pause            # 仅在非暂停状态下触发（此处已由 # 停用）。
profile-restore = copy               # 当条件不再满足时，还原回之前的置顶状态。
ontop = yes                          # 窗口保持最前端显示。

[vsync-auto]
profile-desc = 基于帧率或垂直同步率的自动视频同步
profile-cond = p.container_fps>32 or (p.display_fps/container_fps) > 32 # 当视频帧率过高或与刷新率不匹配时。
profile-restore = copy               # 退出条件后还原。
interpolation = no                   # 高帧率视频无需开启插值补帧。
#video-sync = display-resample-vdrop  # 使用带丢帧补偿的同步模式，防止性能不足导致的卡顿。

[deband-bitrate]
profile-desc = 基于码率的自动去色带
profile-cond = ((p.file_size/1024)*8)/p.duration<=3000 # 当视频平均码率低于 3000kbps 时触发。
profile-restore = copy               # 还原配置。
deband = yes                         # 对低码率视频强制开启去色带，消除块状伪影。

[save-props-auto]
profile-desc = 基于进度或时长或视频轨类型的自动保存属性
profile-cond = 'p.percent_pos>=90 or p.duration<=300 or not vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]'
profile-restore = copy               # 条件触发后，对当前文件状态进行保存。
save-position-on-quit = no           # 默认不自动保存进度。Shift+Q 退出时仍会保存。

[HDR]
profile-desc = HDR 视频自动处理方案
profile-cond = p["video-params/sig-peak"] > 1 # 当检测到视频信号峰值大于标准 SDR 范围时触发。
profile-restore = copy
hwdec = auto-safe                    # HDR 必须确保硬解链路安全。
d3d11-output-format = rgba8          # 设置 HDR 输出的位深格式。
tone-mapping = hable                 # 使用 Hable 算法进行 HDR 到 SDR 的色调映射。
hdr-compute-peak = yes               # 动态计算 HDR 的峰值亮度，使明暗过渡更自然。
target-colorspace = bt.709           # 强制将色彩空间映射到标准 HD 设备通用的 BT.709。
blend-subtitles = no                 # 不将字幕混合到 HDR 视频流中，防止字幕颜色因映射而发暗。

[SDR]
profile-desc = 标准动态范围视频配置

[SRT-Drama]
profile-desc = SRT-Drama（实拍剧集专用字幕预设）
sub-font = sans-serif                # 指定纯文本字幕的后备字体。
sub-font-size = 55                   # 设置字幕字体大小。
sub-color = "#FFFFFFFF"              # 字幕颜色：纯白（AA 为 FF 不透明）。
sub-border-size = 0.5                # 字幕边框线条粗细。
sub-border-color = "#FF303030"       # 边框颜色：深灰色。
sub-blur = 1                         # 边缘模糊：使字幕看起来更柔和，不刺眼。
sub-margin-x = 45                    # 字幕在水平方向上的安全边距。
sub-margin-y = 45                    # 字幕在垂直方向上的安全边距。

[SRT-Anime]
profile-desc = SRT-Anime（动漫专用字幕预设）
sub-use-margins = no                 # 尽量将字幕放置在视频画面内，而不是底部的黑边。
sub-font = 方正准圆_GBK               # 指定中文字体。
sub-font-size = 45                   # 动漫字幕通常较小，设为 45。
sub-color = "#FFFFFFFF"              # 字幕主体颜色：纯白。
sub-border-size = 2                  # 动漫字幕通常带较厚边框以防背景干扰。
sub-border-color = "#FF654321"       # 边框颜色：带有动漫特色的暖褐色。
sub-back-color = "#00000000"         # 背景色完全透明。
sub-shadow-color = "#FF303030"       # 阴影颜色。
sub-shadow-offset = 0                # 阴影偏移量：0 表示不开启阴影。
sub-bold = yes                       # 强制加粗，适应动漫快节奏阅读。
sub-margin-x = 35                    # 水平边距。
sub-margin-y = 35                    # 垂直边距。
